description: SOASTA was a web and mobile performance-testing company known for CloudTest (cloud-based
  load and performance testing) and mPulse (real user monitoring / RUM). It was surfaced as a portfolio
  company of Canaan Partners and added to the API Evangelist network as a stub for enrichment. SOASTA was
  acquired by Akamai Technologies (its products were folded into Akamai's mPulse and CloudTest offerings);
  the former soasta.com domain now 301-redirects to akamai.com, so SOASTA no longer operates an independent
  developer portal, API surface, or product presence of its own.
